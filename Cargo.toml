[package]
name = "posthorn"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
authors = ["Posthorn contributors"]
description = "A Rust reimplementation of the Mako Wayland notification daemon (work in progress)"
license = "MIT"
repository = "https://github.com/sguzman/posthorn"
publish = false

[dependencies]
regex = "1.12"
zbus = "5.19"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
