[package]
name = "posthorn"
default-run = "posthorn"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
authors = ["Posthorn contributors"]
description = "A Rust reimplementation of the Mako Wayland notification daemon (work in progress)"
license = "MIT"
repository = "https://github.com/sguzman/posthorn"
publish = false

[dependencies]
regex = "1.12"
serde_json = "1.0"
pangocairo = "0.22"
tempfile = "3.25"
nix = { version = "0.30", features = ["poll"] }
zbus = "5.19"
serde = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "time"] }
wayland-client = "0.31.15"
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }

[features]
default = []
dbus-integration = []

[dev-dependencies]
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
