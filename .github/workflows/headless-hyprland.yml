name: Experimental Headless Hyprland
on:
  # Requires an intentionally selected runner with a functioning graphics
  # backend. Generic GitHub Arch containers cannot initialize Aquamarine.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-headless:
    name: Arch Hyprland native compositor QA (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: archlinux:latest
    steps:
      - name: Install current Arch compositor and Rust dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel pkgconf rust cargo dbus hyprland sway grim \
            mesa pango cairo gdk-pixbuf2
      - uses: actions/checkout@v4
      - name: Compile private Posthorn daemon and Rust pixel probe
        run: cargo build --bin posthorn --example qa_png_probe
      - name: Create unprivileged isolated compositor account
        run: |
          useradd --create-home --shell /bin/bash posthornqa
          chmod a+rx /__w /__w/posthorn /__w/posthorn/posthorn
          # A CI container can forbid Sway's packaged cap_sys_nice file
          # capability; a normal copied binary needs no real-time privilege.
          install -m 0755 "$(command -v sway)" /usr/local/bin/sway-qa-unprivileged
      - name: Private D-Bus notification lifecycle on actual headless Hyprland
        run: |
          runuser -u posthornqa -- env HOME=/home/posthornqa \
            GITHUB_ACTIONS=true POSTHORN_HEADLESS_HYPRLAND_TEST=1 \
            dbus-run-session -- bash tests/headless_hyprland.sh
