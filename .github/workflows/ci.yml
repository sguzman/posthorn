name: Rust CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - name: Verify private Hyprland QA safety guards
        run: |
          bash -n tests/hyprland_private.sh
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          if env -u POSTHORN_HYPRLAND_QA bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'Unguarded Hyprland QA unexpectedly succeeded'
            exit 1
          fi
          grep -q 'explicit POSTHORN_HYPRLAND_QA=1 guard required' "$output"
          if POSTHORN_HYPRLAND_QA=0 bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'Disabled Hyprland QA unexpectedly succeeded'
            exit 1
          fi
          grep -q 'Hyprland QA not authorized' "$output"
          if env -u HYPRLAND_INSTANCE_SIGNATURE POSTHORN_HYPRLAND_QA=1 \
              bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'QA without a Hyprland session unexpectedly succeeded'
            exit 1
          fi
          grep -q 'real Hyprland Wayland session is required' "$output"
          if POSTHORN_HYPRLAND_QA=1 bash tests/hyprland_private.sh --inside >"$output" 2>&1; then
            echo 'Direct nested QA unexpectedly bypassed its parent'
            exit 1
          fi
          grep -q 'nested QA entrypoint requires original-bus verification by parent' "$output"
          if POSTHORN_HYPRLAND_QA=1 POSTHORN_QA_NESTED=1 \
              POSTHORN_QA_PARENT_BUS=unix:path=/tmp/test-bus \
              DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/test-bus \
              bash tests/hyprland_private.sh --inside >"$output" 2>&1; then
            echo 'Nested QA unexpectedly accepted the original bus'
            exit 1
          fi
          grep -q 'nested QA must not run on the original session bus' "$output"
      - run: dbus-run-session -- cargo test --tests --features dbus-integration -- --test-threads=1
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/render_roadmap.py && git diff --exit-code -- docs/ROADMAP.md

  headless-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sway grim python3-pil libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --bin posthorn --example qa_virtual_pointer --example qa_png_probe --example qa_dual_surface --example qa_input_region
      - name: Verify 1x private popup and close/repaint
        run: dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify 1.25x fractional compositor popup and close/repaint
        run: POSTHORN_TEST_SCALE=1.25 dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify 2x HiDPI private popup and close/repaint
        run: POSTHORN_TEST_SCALE=2 dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify private multi-surface named output routing and unplug
        run: dbus-run-session -- bash tests/headless_multi_output.sh
      - name: Verify compositor click-through input regions
        run: dbus-run-session -- bash tests/headless_input_region.sh
