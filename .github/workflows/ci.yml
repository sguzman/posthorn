name: Rust CI
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - name: Verify private Hyprland QA safety guards
        run: |
          bash -n tests/hyprland_private.sh
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          if env -u POSTHORN_HYPRLAND_QA bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'Unguarded Hyprland QA unexpectedly succeeded'
            exit 1
          fi
          grep -q 'explicit POSTHORN_HYPRLAND_QA=1 guard required' "$output"
          if POSTHORN_HYPRLAND_QA=0 bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'Disabled Hyprland QA unexpectedly succeeded'
            exit 1
          fi
          grep -q 'Hyprland QA not authorized' "$output"
          for variable in POSTHORN_PRODUCTION_TRIAL_AUTHORIZED \
            POSTHORN_PRODUCTION_TRIAL_EXPECTED_BUS_ADDRESS \
            POSTHORN_PRODUCTION_TRIAL_MAX_SECONDS; do
            if env -u HYPRLAND_INSTANCE_SIGNATURE POSTHORN_HYPRLAND_QA=1 \
                "$variable=1" bash tests/hyprland_private.sh >"$output" 2>&1; then
              echo "Private QA accepted production-trial arming: $variable"
              exit 1
            fi
            grep -q 'private Hyprland QA refuses production-trial environment' "$output"
          done
          if POSTHORN_HYPRLAND_QA=1 POSTHORN_PRODUCTION_TRIAL_AUTHORIZED='' \
              bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'Private QA accepted an empty but present trial authorization'
            exit 1
          fi
          grep -q 'private Hyprland QA refuses production-trial environment' "$output"
          if env -u HYPRLAND_INSTANCE_SIGNATURE POSTHORN_HYPRLAND_QA=1 \
              bash tests/hyprland_private.sh >"$output" 2>&1; then
            echo 'QA without a Hyprland session unexpectedly succeeded'
            exit 1
          fi
          grep -q 'real Hyprland Wayland session is required' "$output"
          if POSTHORN_HYPRLAND_QA=1 bash tests/hyprland_private.sh --inside >"$output" 2>&1; then
            echo 'Direct nested QA unexpectedly bypassed its parent'
            exit 1
          fi
          grep -q 'nested QA entrypoint requires original-bus verification by parent' "$output"
          if POSTHORN_HYPRLAND_QA=1 POSTHORN_QA_NESTED=1 \
              POSTHORN_QA_PARENT_BUS=unix:path=/tmp/test-bus \
              DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/test-bus \
              bash tests/hyprland_private.sh --inside >"$output" 2>&1; then
            echo 'Nested QA unexpectedly accepted the original bus'
            exit 1
          fi
          grep -q 'nested QA must not run on the original session bus' "$output"
      - name: Verify pinned original user-bus GUID mismatch fails closed
        run: bash tests/mock_hyprland_parent_bus.sh
      - name: Verify guarded read-only owner inventory defaults to refusal
        run: |
          bash -n tests/hyprland_private.sh
          bash -n tests/read_only_owner_inventory.sh
          output="$(mktemp)"
          trap 'rm -f "$output"' EXIT
          if env -u POSTHORN_HYPRLAND_QA bash tests/read_only_owner_inventory.sh >"$output" 2>&1; then
            echo 'Unarmed owner inventory should never run'
            exit 1
          fi
          grep -q 'explicit POSTHORN_HYPRLAND_QA=1 guard required' "$output"
          if POSTHORN_HYPRLAND_QA=1 POSTHORN_PRODUCTION_TRIAL_AUTHORIZED=1 bash tests/read_only_owner_inventory.sh >"$output" 2>&1; then
            echo 'Armed trial bypassed read-only inventory refusal'
            exit 1
          fi
          grep -q 'refuse inventory while production-trial environment is present' "$output"
          for variable in POSTHORN_PRODUCTION_TRIAL_AUTHORIZED \
            POSTHORN_PRODUCTION_TRIAL_EXPECTED_BUS_ADDRESS \
            POSTHORN_PRODUCTION_TRIAL_MAX_SECONDS; do
            if env -u HYPRLAND_INSTANCE_SIGNATURE POSTHORN_HYPRLAND_QA=1 \
              "$variable=" bash tests/read_only_owner_inventory.sh >"$output" 2>&1; then
              echo "Inventory accepted inherited production-trial marker $variable" >&2
              exit 1
            fi
            grep -q 'refuse inventory while production-trial environment is present' "$output"
          done
          if env -u HYPRLAND_INSTANCE_SIGNATURE POSTHORN_HYPRLAND_QA=1 bash tests/read_only_owner_inventory.sh >"$output" 2>&1; then
            echo 'Original real Hyprland requirement bypassed'
            exit 1
          fi
          grep -q 'real Hyprland session and original D-Bus address required' "$output"
      - name: Verify read-only owner inspection against synthetic Mako process
        run: bash tests/mock_owner_inventory.sh
      - run: dbus-run-session -- cargo test --tests --features dbus-integration -- --test-threads=1
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/render_roadmap.py && git diff --exit-code -- docs/ROADMAP.md

  headless-wayland:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq sway grim python3-pil libpango1.0-dev libcairo2-dev libgdk-pixbuf-2.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --bin posthorn --example qa_virtual_pointer --example qa_png_probe --example qa_dual_surface --example qa_input_region --example qa_icon_theme
      - name: Verify 1x private popup and close/repaint
        run: dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify 1.25x fractional compositor popup and close/repaint
        run: POSTHORN_TEST_SCALE=1.25 dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify 2x HiDPI private popup and close/repaint
        run: POSTHORN_TEST_SCALE=2 dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify actual 9x compositor scale private popup and dismissal
        run: POSTHORN_TEST_SCALE=9 dbus-run-session -- bash tests/headless_wayland.sh
      - name: Verify private multi-surface named output routing and unplug
        run: dbus-run-session -- bash tests/headless_multi_output.sh
      - name: Verify compositor click-through input regions
        run: dbus-run-session -- bash tests/headless_input_region.sh
      - name: Verify mixed-output DPI icon selection and bottom-edge pointer routing
        run: dbus-run-session -- bash tests/headless_mixed_scale.sh
      - name: Verify reversible production-name trial on isolated software compositor
        run: POSTHORN_PUBLIC_TRIAL_CI=1 dbus-run-session -- bash tests/public_trial_isolated.sh
      - name: Verify pinned Mako superstyle margins from unmatched criteria
        run: dbus-run-session -- bash tests/headless_superstyle_margin.sh
      - name: Verify signed Mako padding on actual compositor mode redraw
        run: dbus-run-session -- bash tests/headless_signed_padding.sh
