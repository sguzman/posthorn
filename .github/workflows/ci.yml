name: Rust CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: dbus-run-session -- cargo test --test dbus_wire --features dbus-integration
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/render_roadmap.py && git diff --exit-code -- docs/ROADMAP.md
